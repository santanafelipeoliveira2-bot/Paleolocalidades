<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PaleoLoc — Localidades Fossilíferas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root {
  --cream:   #F5F0E8;
  --sand:    #E8DCC8;
  --tan:     #C9B99A;
  --blue:    #4A7FA5;
  --blue-lt: #D6E8F5;
  --blue-dk: #2C5F7A;
  --amber:   #C8834A;
  --amber-lt:#F2E0CC;
  --navy:    #2D4A6B;
  --gray:    #8A8A8A;
  --white:   #FFFFFF;
  --sidebar-w: 310px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--cream);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  background: var(--navy);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  z-index: 1100;
}
.logo-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.logo-img { height: 38px; width: 38px; object-fit: contain; border-radius: 6px; }
.logo-text { line-height: 1.15; }
.logo-text .t1 { font-size: .95rem; font-weight: 700; letter-spacing: .5px; }
.logo-text .t1 span { color: var(--amber); }
.logo-text .t1 em { color: var(--blue-lt); font-style: normal; }
.logo-text .t2 { font-size: .65rem; color: var(--tan); letter-spacing: .3px; }
.badge {
  background: var(--amber);
  color: var(--white);
  border-radius: 12px;
  padding: 3px 10px;
  font-size: .72rem;
  font-weight: 700;
  white-space: nowrap;
}

/* Toggle botão (mobile) */
#toggle-btn {
  background: var(--blue);
  border: none;
  border-radius: 8px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .2s;
}
#toggle-btn:hover { background: var(--blue-dk); }
#toggle-btn svg { stroke: white; }

/* ── LAYOUT ── */
.main { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--white);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--sand);
  overflow: hidden;
  transition: transform .3s ease, width .3s ease;
  flex-shrink: 0;
  z-index: 1000;
}
#sidebar.collapsed {
  width: 0;
  transform: translateX(-100%);
  border: none;
}

@media (max-width: 640px) {
  #sidebar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: min(var(--sidebar-w), 88vw);
    box-shadow: 4px 0 20px rgba(0,0,0,.15);
  }
  #sidebar.collapsed {
    transform: translateX(-100%);
    width: min(var(--sidebar-w), 88vw);
  }
}

/* Overlay escurecido no mobile quando sidebar aberta */
#overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.3);
  z-index: 999;
}
@media (max-width: 640px) {
  #overlay.show { display: block; }
}

/* ── BLOCOS DA SIDEBAR ── */
.sb-block { padding: 11px 13px; border-bottom: 1px solid var(--sand); }
.sb-block h3 {
  font-size: .62rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--gray);
  margin-bottom: 7px;
}
.sel-label {
  display: block;
  font-size: .67rem;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--gray);
  margin-bottom: 3px;
}
input[type=text], select {
  width: 100%;
  padding: 7px 10px;
  background: var(--cream);
  border: 1px solid var(--tan);
  color: var(--navy);
  border-radius: 6px;
  font-size: .82rem;
  outline: none;
  margin-bottom: 6px;
  -webkit-appearance: none;
}
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-lt); }
.btn-download {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  background: var(--blue-lt);
  color: var(--blue-dk);
  border: 1px solid var(--blue);
  border-radius: 6px;
  cursor: pointer;
  font-size: .75rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background .2s;
  flex-shrink: 0;
}
.btn-download:hover { background: var(--blue); color: white; }
.btn-download:hover svg { stroke: white; }
.btn-reset {
  width: 100%;
  padding: 7px;
  background: #FFF0EC;
  color: #B05030;
  border: 1px solid #E8B09A;
  border-radius: 6px;
  cursor: pointer;
  font-size: .8rem;
  transition: background .2s;
}
.btn-reset:hover { background: #F5C8B4; }

/* ── LEGENDA ── */
.leg-item {
  display: flex; align-items: center; gap: 7px;
  margin: 3px 0; font-size: .73rem;
  color: var(--navy);
  cursor: pointer; padding: 2px 0;
}
.leg-item:hover { opacity: .75; }
.leg-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

/* ── LISTA ── */
#list-panel { flex: 1; overflow-y: auto; }
#list-panel::-webkit-scrollbar { width: 4px; }
#list-panel::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 2px; }
.li {
  padding: 10px 13px;
  border-bottom: 1px solid #F0EAE0;
  cursor: pointer;
  transition: background .15s;
}
.li:hover { background: var(--cream); }
.li.active { background: var(--blue-lt); border-left: 3px solid var(--blue); }
.li-title { font-size: .8rem; font-weight: 600; color: var(--navy); line-height: 1.3; }
.li-sub { font-size: .72rem; color: var(--gray); margin-top: 2px; line-height: 1.4; }
.li-pill {
  display: inline-block; font-size: .62rem;
  padding: 1px 7px; border-radius: 10px; margin-top: 4px; font-weight: 600;
}

/* ── MAPA ── */
#map { flex: 1; position: relative; }

/* ── PAINEL DE ATRIBUTOS ── */
#attr-panel {
  position: absolute;
  bottom: 14px; right: 14px;
  background: var(--white);
  border: 1px solid var(--sand);
  border-radius: 12px;
  padding: 14px 16px;
  width: min(320px, calc(100vw - 28px));
  max-height: 55vh;
  overflow-y: auto;
  z-index: 1000;
  display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
}
#attr-panel::-webkit-scrollbar { width: 4px; }
#attr-panel::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 2px; }
#attr-close {
  position: absolute; top: 9px; right: 11px;
  background: var(--sand); border: none; border-radius: 50%;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: .85rem; color: var(--navy);
}
#attr-close:hover { background: var(--tan); }
.attr-title {
  font-size: .88rem; font-weight: 700; color: var(--navy);
  margin-bottom: 10px; padding-bottom: 7px;
  border-bottom: 2px solid var(--amber);
  padding-right: 26px; line-height: 1.4;
}
.attr-row { display: flex; gap: 8px; margin: 5px 0; font-size: .77rem; align-items: flex-start; }
.attr-k { color: var(--gray); min-width: 110px; flex-shrink: 0; padding-top: 1px; }
.attr-v { color: var(--navy); line-height: 1.45; }
.attr-grupo { font-weight: 600; }

/* ── TOOLTIP ── */
.leaflet-tooltip.ftip {
  background: var(--white);
  border: 1px solid var(--sand);
  color: var(--navy);
  font-size: .73rem;
  padding: 4px 8px;
  border-radius: 5px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

/* Cluster cores pastel */
.cluster-icon {
  background: var(--blue);
  border: 2.5px solid var(--white);
  border-radius: 50%;
  color: white;
  font-weight: 700;
  font-size: .72rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

/* Contagem mobile no rodapé do mapa */
#map-footer {
  position: absolute;
  bottom: 6px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,.92);
  border: 1px solid var(--sand);
  border-radius: 20px;
  padding: 3px 14px;
  font-size: .72rem;
  color: var(--navy);
  z-index: 900;
  pointer-events: none;
  white-space: nowrap;
}
</style>

cada":"—","Grandes_Grupos":"Vertebrados","Pequenos_Grupos":"Mamíferos","Observação":"Encontrado na Gruta Lapa Vermelha: Dasypodidae"},{"Trabalho":309,"Longitude_X":-43.54411,"Latitude_Y":-19.40299,"Região":"SE","Bacia":"—","Unidade_Estratigráfica":"—","Idade":"Quaternário","Idade_específicada":"—","Grandes_Grupos":"Vertebrados","Pequenos_Grupos":"Mamíferos","Observação":"Encontrado na Gruta Lapa Vermelha: Procyonidae"},{"Trabalho":310,"Longitude_X":-43.54411,"Latitude_Y":-19.40299,"Região":"SE","Bacia":"—","Unidade_Estratigráfica":"—","Idade":"Quaternário","Idade_específicada":"—","Grandes_Grupos":"Vertebrados","Pequenos_Grupos":"Mamíferos","Observação":"Encontrado na Gruta Lapa Vermelha: Felidae"},{"Trabalho":311,"Longitude_X":-43.54411,"Latitude_Y":-19.40299,"Região":"SE","Bacia":"—","Unidade_Estratigráfica":"—","Idade":"Quaternário","Idade_específicada":"—","Grandes_Grupos":"Vertebrados","Pequenos_Grupos":"Mamíferos","Observação":"Encontrado na Gruta Lapa Vermelha: Cervidae"},{"Trabalho":312,"Longitude_X":-43.54411,"Latitude_Y":-19.40299,"Região":"SE","Bacia":"—","Unidade_Estratigráfica":"—","Idade":"Quaternário","Idade_específicada":"—","Grandes_Grupos":"Vertebrados","Pequenos_Grupos":"Mamíferos","Observação":"Encontrado na Gruta Lapa Vermelha: Mustelidae"}];

// ── PALETA PASTEL POR GRUPO ──
const CORES = {
  'Vertebrados'                : {fill:'#A8C5E0', border:'#5A8FB0', text:'#2C5F7A'},
  'Invertebrados'              : {fill:'#B8D4A8', border:'#6A9A58', text:'#2A5A1E'},
  'Plantas'                    : {fill:'#C8DFB0', border:'#7AB060', text:'#305820'},
  'Icnofósseis (Vertebrados)'  : {fill:'#F0D8A8', border:'#C8A050', text:'#6A4A10'},
  'Icnofósseis (Invertebrados)': {fill:'#E0C8E8', border:'#A880C0', text:'#502870'},
  'Icnofósseis'                : {fill:'#F5E0B0', border:'#C8A860', text:'#6A4A18'},
  'Estomatólito'               : {fill:'#B0E0D8', border:'#60A898', text:'#1A5048'},
  'Não especificado'           : {fill:'#D8D4CC', border:'#A8A098', text:'#484440'}
};
function gc(g){ return CORES[g] || CORES['Não especificado']; }

// ── MAPA ──
const map = L.map('map', {center:[-20.5,-44], zoom:6, preferCanvas:true, zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);

// Camadas de fundo — OpenStreetMap (sem API key)
const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors', maxZoom:19}).addTo(map);
const baseCarto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CartoDB', subdomains:'abcd', maxZoom:19});
const baseTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenStreetMap &copy; OpenTopoMap', maxZoom:17});

L.control.layers({'OpenStreetMap':baseOSM, 'CartoDB Voyager':baseCarto, 'Topográfico':baseTopo}, null,
  {position:'topright', collapsed:true}).addTo(map);

// ── POLÍGONOS UFs ──
const SE = new Set(['MG','RJ','SP','ES']);
L.geoJSON(ESTADOS, {
  style: function(f) {
    return SE.has(f.properties.sigla)
      ? {fillColor:'#C8DCEE', fillOpacity:0.55, color:'#4A7FA5', weight:1.5}
      : {fillColor:'#E8E4DC', fillOpacity:0.45, color:'#B0A898', weight:0.8};
  },
  onEachFeature: function(f, layer) {
    layer.bindTooltip('<b>'+f.properties.name+'</b> ('+f.properties.sigla+')',
      {className:'ftip', sticky:true});
  }
}).addTo(map);

// ── CLUSTERS ──
const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  iconCreateFunction: function(c) {
    const n = c.getChildCount();
    const s = n > 100 ? 42 : n > 30 ? 34 : 26;
    return L.divIcon({
      html: '<div class="cluster-icon" style="width:'+s+'px;height:'+s+'px">'+n+'</div>',
      className: '', iconSize:[s,s], iconAnchor:[s/2,s/2]
    });
  }
});
map.addLayer(cluster);

function mkIcon(g) {
  const c = gc(g);
  return L.divIcon({
    html: '<div style="width:13px;height:13px;border-radius:50%;background:'+c.fill+';border:2px solid '+c.border+';box-shadow:0 1px 4px rgba(0,0,0,.2)"></div>',
    className: '', iconSize:[13,13], iconAnchor:[6.5,6.5]
  });
}

const CAMPOS = [
  ['Trabalho','Nº Trabalho'],['Bacia','Bacia'],
  ['Unidade_Estratigráfica','Unidade Estratigráfica'],
  ['Idade','Período'],['Idade_específicada','Idade específica'],
  ['Grandes_Grupos','Grande Grupo'],['Pequenos_Grupos','Pequenos Grupos'],
  ['Observação','Observação'],['Longitude_X','Longitude'],['Latitude_Y','Latitude']
];

function showAttr(d) {
  const c = gc(d.Grandes_Grupos);
  const titulo = (d.Unidade_Estratigráfica && d.Unidade_Estratigráfica !== '—')
    ? d.Unidade_Estratigráfica : d.Grandes_Grupos;
  document.getElementById('attr-title').textContent = titulo;
  document.getElementById('attr-title').style.borderBottomColor = c.border;
  let html = '';
  CAMPOS.forEach(function(kv) {
    const v = d[kv[0]];
    if (!v || v === '—') return;
    const disp = (kv[0]==='Longitude_X'||kv[0]==='Latitude_Y') ? parseFloat(v).toFixed(5) : v;
    html += '<div class="attr-row"><span class="attr-k">'+kv[1]+'</span><span class="attr-v">'+disp+'</span></div>';
  });
  html += '<div class="attr-row"><span class="attr-k">Grupo</span><span class="attr-v attr-grupo" style="color:'+c.text+'">'+d.Grandes_Grupos+'</span></div>';
  document.getElementById('attr-body').innerHTML = html;
  document.getElementById('attr-panel').style.display = 'block';
}

function closeAttr() {
  document.getElementById('attr-panel').style.display = 'none';
  activeIdx = null;
  document.querySelectorAll('.li').forEach(function(e){e.classList.remove('active');});
}
document.getElementById('attr-close').onclick = closeAttr;

let allMarkers = [], activeIdx = null;

FOSSEIS.forEach(function(d, i) {
  const m = L.marker([d.Latitude_Y, d.Longitude_X], {icon: mkIcon(d.Grandes_Grupos)});
  const unt = (d.Unidade_Estratigráfica && d.Unidade_Estratigráfica !== '—') ? d.Unidade_Estratigráfica : d.Grandes_Grupos;
  const pg  = (d.Pequenos_Grupos && d.Pequenos_Grupos !== '—') ? d.Pequenos_Grupos : '';
  m.bindTooltip('<b>'+unt+'</b>'+(pg?'<br>'+pg:'')+'<br><i>'+d.Idade+'</i>', {className:'ftip', sticky:true});
  m.on('click', function() { selectItem(i); });
  allMarkers.push({d:d, m:m});
  cluster.addLayer(m);
});

// ── SELECTS ──
function uniq(arr) { return arr.filter(function(v,i,a){return v&&v!=='—'&&a.indexOf(v)===i;}).sort(); }
function fillSel(id, vals) {
  const s = document.getElementById(id);
  vals.forEach(function(v){const o=document.createElement('option');o.value=o.textContent=v;s.appendChild(o);});
}
fillSel('f-regiao',   uniq(FOSSEIS.map(function(d){return d['Região'];})));
fillSel('f-bacia',    uniq(FOSSEIS.map(function(d){return d.Bacia;})));
fillSel('f-unidade',  uniq(FOSSEIS.map(function(d){return d['Unidade_Estratigráfica'];})));
fillSel('f-idade',    uniq(FOSSEIS.map(function(d){return d.Idade;})));
fillSel('f-idade-esp',uniq(FOSSEIS.map(function(d){return d['Idade_específicada'];})));
fillSel('f-grupo',    uniq(FOSSEIS.map(function(d){return d.Grandes_Grupos;})));
fillSel('f-pequeno',  uniq(FOSSEIS.map(function(d){return d.Pequenos_Grupos;})));
fillSel('f-obs',      uniq(FOSSEIS.map(function(d){return d['Observação'];})));

// ── LEGENDA ──
const leg = document.getElementById('legend');
uniq(FOSSEIS.map(function(d){return d.Grandes_Grupos;})).forEach(function(g) {
  const c = gc(g);
  const el = document.createElement('div');
  el.className = 'leg-item';
  el.innerHTML = '<div class="leg-dot" style="background:'+c.fill+';border:1.5px solid '+c.border+'"></div><span>'+g+'</span>';
  el.onclick = function(){document.getElementById('f-grupo').value=g;applyFilters();if(window.innerWidth<=640)openSidebar();};
  leg.appendChild(el);
});

// ── FILTROS ──
var filteredData = [];
function applyFilters() {
  const q        = document.getElementById('q').value.toLowerCase().trim();
  const regiao   = document.getElementById('f-regiao').value;
  const bacia    = document.getElementById('f-bacia').value;
  const unidade  = document.getElementById('f-unidade').value;
  const idade    = document.getElementById('f-idade').value;
  const idadeEsp = document.getElementById('f-idade-esp').value;
  const grupo    = document.getElementById('f-grupo').value;
  const pequeno  = document.getElementById('f-pequeno').value;
  const obs      = document.getElementById('f-obs').value;
  filteredData = [];

  cluster.clearLayers();
  const panel = document.getElementById('list-panel');
  panel.innerHTML = '';
  let count = 0;

  allMarkers.forEach(function(obj, i) {
    const d = obj.d;
    const busca = [d['Unidade_Estratigráfica'], d.Pequenos_Grupos, d.Bacia, d.Observação].join(' ').toLowerCase();
    const match =
      (!regiao   || d['Região'] === regiao) &&
      (!bacia    || d.Bacia === bacia) &&
      (!unidade  || d['Unidade_Estratigráfica'] === unidade) &&
      (!idade    || d.Idade === idade) &&
      (!idadeEsp || d['Idade_específicada'] === idadeEsp) &&
      (!grupo    || d.Grandes_Grupos === grupo) &&
      (!pequeno  || d.Pequenos_Grupos === pequeno) &&
      (!obs      || d['Observação'] === obs) &&
      (!q        || busca.includes(q));

    if (match) {
      cluster.addLayer(obj.m);
      filteredData.push(d);
      count++;
      const c = gc(d.Grandes_Grupos);
      const unt = (d.Unidade_Estratigráfica && d.Unidade_Estratigráfica !== '—') ? d.Unidade_Estratigráfica : d.Bacia;
      const sub = (d.Pequenos_Grupos && d.Pequenos_Grupos !== '—') ? d.Pequenos_Grupos : d.Grandes_Grupos;
      const age = (d.Idade_específicada && d.Idade_específicada !== '—') ? d.Idade_específicada : d.Idade;
      const el = document.createElement('div');
      el.className = 'li'+(i===activeIdx?' active':'');
      el.dataset.idx = i;
      el.innerHTML =
        '<div class="li-title">'+unt+'</div>'+
        '<div class="li-sub">'+sub+' · '+age+'</div>'+
        '<span class="li-pill" style="background:'+c.fill+';color:'+c.text+';border:1px solid '+c.border+'">'+d.Grandes_Grupos+'</span>';
      el.onclick = function(){ selectItem(i); };
      panel.appendChild(el);
    }
  });

  document.getElementById('badge').textContent = count;
  document.getElementById('cnt').textContent = count;
  document.getElementById('map-footer').textContent = count+' localidades · Sudeste do Brasil';
}

function selectItem(i) {
  const obj = allMarkers[i];
  activeIdx = i;
  document.querySelectorAll('.li').forEach(function(e){e.classList.remove('active');});
  const el = document.querySelector('.li[data-idx="'+i+'"]');
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
  // No mobile fecha o sidebar ao selecionar
  if (window.innerWidth <= 640) { closeSidebar(); }
  map.flyTo([obj.d.Latitude_Y, obj.d.Longitude_X], 12, {duration:0.7});
  showAttr(obj.d);
}

// ── SIDEBAR TOGGLE ──
let sidebarOpen = window.innerWidth > 640;
function toggleSidebar() {
  if (sidebarOpen) { closeSidebar(); } else { openSidebar(); }
}
function openSidebar() {
  document.getElementById('sidebar').classList.remove('collapsed');
  document.getElementById('overlay').classList.add('show');
  sidebarOpen = true;
}
function closeSidebar() {
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('overlay').classList.remove('show');
  sidebarOpen = false;
}
// Mobile: começa fechado
if (window.innerWidth <= 640) { closeSidebar(); }

document.getElementById('btn-reset').onclick = function() {
  document.getElementById('q').value='';
  ['f-regiao','f-bacia','f-unidade','f-idade','f-idade-esp','f-grupo','f-pequeno','f-obs'].forEach(function(id){document.getElementById(id).value='';});
  closeAttr(); applyFilters();
};
['f-regiao','f-bacia','f-unidade','f-idade','f-idade-esp','f-grupo','f-pequeno','f-obs'].forEach(function(id){
  document.getElementById(id).addEventListener('change', applyFilters);
});

// ── DOWNLOAD EXCEL (CSV compatível com Excel) ──
document.getElementById('btn-download').onclick = function() {
  if (!filteredData.length) return;
  const cols = ['Trabalho','Longitude_X','Latitude_Y','Região','Bacia',
    'Unidade_Estratigráfica','Idade','Idade_específicada',
    'Grandes_Grupos','Pequenos_Grupos','Observação'];
  const bom = '\uFEFF';
  const header = cols.join(';');
  const rows = filteredData.map(function(d) {
    return cols.map(function(c) {
      var v = d[c] !== undefined ? String(d[c]) : '';
      if (v.indexOf(';') > -1 || v.indexOf('"') > -1 || v.indexOf('\n') > -1) {
        v = '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    }).join(';');
  });
  const csv = bom + header + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'paleoloc_localidades_' + filteredData.length + 'registros.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById('q').addEventListener('input', applyFilters);

applyFilters();
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);
</script>
</body>
</html>
